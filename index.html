<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIDA IBBUL CONNECT</title>
<style>
:root{--bg:#f6f8f5;--sf:#fff;--tx:#14211a;--mu:#5b6b61;--pr:#0f6b3d;--pr2:#e3f2ea;--bd:#dbe3dd;--ac:#c8922a;--dg:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--sf:#17211b;--tx:#e8efe9;--mu:#9bab9f;--pr:#4cc28a;--pr2:#183626;--bd:#2a382f;--ac:#e0b04f;--dg:#f2918b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--sf);border-bottom:1px solid var(--bd);z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:1000px;margin:auto}
.logo{font-weight:800;color:var(--pr);text-decoration:none;font-size:1.05rem}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1000px;margin:auto}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--mu);text-decoration:none;font-size:.9rem}
nav a.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{max-width:1000px;margin:auto;padding:16px;min-height:60vh}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.2em 0 .5em}
.hero{background:linear-gradient(135deg,var(--pr),#0a4a2a);color:#fff;border-radius:16px;padding:28px 20px}.hero p{opacity:.92;max-width:560px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:#fff;text-decoration:none}
.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr)}.btn.w{background:#fff;color:#0a4a2a}.btn.d{background:var(--dg);color:#fff}.btn.s{padding:6px 10px;font-size:.85rem;margin:2px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--pr2);color:var(--pr);display:grid;place-items:center;font-weight:700;margin-bottom:8px}
.mu{color:var(--mu);font-size:.88rem}.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:99px;padding:2px 9px;font-size:.78rem;margin:2px 4px 2px 0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:.88rem;font-weight:600}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.chk{display:flex;align-items:center;gap:8px;font-weight:400}.chk input{width:auto;margin:0}
.form{max-width:440px;margin:auto}.note{background:var(--pr2);border-radius:10px;padding:10px;font-size:.88rem;margin:10px 0}
.admin{border-top:4px solid var(--ac)}.msg{padding:10px;border-radius:10px;background:var(--pr2);margin:10px 0}.err{background:#fde7e5;color:#8c1d18}
footer{text-align:center;padding:24px 16px;color:var(--mu);font-size:.85rem}footer a{color:var(--mu);margin:0 6px}
</style></head><body>
<header><div class="bar"><a class="logo" href="#home">BIDA IBBUL CONNECT</a><span id="who" class="mu"></span></div><nav id="nav"></nav></header>
<main id="app"><p class="mu">Loading…</p></main>
<footer><a href="#privacy">Privacy</a><a href="#guidelines">Guidelines</a><a href="#contact">Contact</a><a href="#admin">Admin login</a><p>© BIDA IBBUL CONNECT</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<script>
if(!window.supabase){document.getElementById('app').innerHTML='<div class="card"><b>The site could not load a required file.</b><p class="mu">Please check your internet connection, refresh the page, or try a different network.</p></div>';throw new Error('Supabase library failed to load')}
function showErr(m){document.getElementById('app').innerHTML='<div class="card"><b>Something went wrong.</b><p class="mu">'+String(m||'Unknown error').replace(/</g,'&lt;')+'</p><p class="mu">Try refreshing the page.</p></div>'}
addEventListener('error',e=>showErr(e.message));
addEventListener('unhandledrejection',e=>showErr(e.reason&&e.reason.message?e.reason.message:e.reason));
const SB=supabase.createClient('https://esjvprhomofdahmpdizl.supabase.co','sb_publishable_DP2OWoX5FS4W0PGvmMBgIA_LdVoow7e',{auth:{flowType:'pkce'}});
const BASE=location.origin+location.pathname;
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(n,u)=>u?`<img class="av" style="object-fit:cover" src="${esc(u)}" alt="${esc(n)}">`:`<div class="av">${ini(n)}</div>`;
const S={sess:null,prof:null,rows:[]};
const approved=()=>S.prof&&(S.prof.status==='approved'||S.prof.is_admin);
const isAdmin=()=>S.prof&&S.prof.is_admin;
async function q(p){const {data,error}=await p;if(error){console.error(error);return null}return data}
async function run(p){const {error}=await p;if(error){alert(error.message);return false}return true}
function msg(id,t,bad){const e=$('#'+id);if(!e)return;e.hidden=false;e.className='msg'+(bad?' err':'');e.textContent=t}
async function loadProf(){S.prof=null;if(S.sess){S.prof=await q(SB.from('profiles').select('*').eq('id',S.sess.user.id).maybeSingle())}}
function pw(id,l){return `<label>${l}</label><input id="${id}" type="password" autocomplete="off"><label class="chk"><input type="checkbox" onchange="$('#${id}').type=this.checked?'text':'password'"> Show password</label><br>`}
function gate(t){return `<h1>${t}</h1><div class="note">${S.sess?'Your account is awaiting administrator approval. You will see this page once you are approved.':'Please <a href="#login">log in</a> or <a href="#register">register</a> to see this page.'}</div>`}
const pub=['home','executives','staff','alumni','students','announcements'];
function nav(){const h=(location.hash||'#home').slice(1);
$('#nav').innerHTML=pub.map(p=>`<a href="#${p}" class="${h==p?'on':''}">${p[0].toUpperCase()+p.slice(1)}</a>`).join('')+(S.sess?`<a href="#profile" class="${h=='profile'?'on':''}">My profile</a><a href="#" onclick="logout();return false">Log out</a>`:`<a href="#login" class="${h=='login'?'on':''}">Log in</a><a href="#register" class="${h=='register'?'on':''}">Register</a>`);
$('#who').textContent=S.prof&&S.prof.full_name?S.prof.full_name.split(' ')[0]:''}
async function logout(){await SB.auth.signOut();S.sess=null;S.prof=null;location.hash='#home';draw()}
async function login(admin){const e=$('#e').value.trim(),p=$('#p').value;if(!e||!p)return msg('lm','Enter your email and password.',1);
const {error}=await SB.auth.signInWithPassword({email:e,password:p});if(error)return msg('lm',error.message,1);
const {data}=await SB.auth.getSession();S.sess=data.session;await loadProf();
if(admin&&!isAdmin()){await SB.auth.signOut();S.sess=null;S.prof=null;draw();return alert('This account is not an administrator.')}
location.hash=admin?'#admin':'#home';draw()}
function prev(i){const f=i.files[0],b=$('#rfp');b.textContent='';if(!f)return;if(f.type.startsWith('image/')){const m=document.createElement('img');m.src=URL.createObjectURL(f);m.alt='Preview';m.style.cssText='max-width:140px;border-radius:10px;display:block;margin-bottom:6px';b.appendChild(m)}b.appendChild(document.createTextNode(f.name))}
async function register(){
const n=$('#rn').value.trim(),e=$('#re').value.trim(),p=$('#rp').value,ind=$('#ri').value.trim(),f=$('#rf').files[0];
if(!n||!e||!ind)return msg('rm','Please fill in your name, email and indigene.',1);
if(p.length<8)return msg('rm','Password must be at least 8 characters.',1);
if(!f||f.size>5242880||!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type))return msg('rm','Upload a JPG, PNG, WebP or PDF under 5 MB.',1);
$('#rb').disabled=true;msg('rm','Creating your account…');
const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
const path=crypto.randomUUID()+'/indigene.'+ext;
const up=await SB.storage.from('indigene-docs').upload(path,f,{contentType:f.type});
if(up.error){$('#rb').disabled=false;return msg('rm','Upload failed: '+up.error.message,1)}
const {data,error}=await SB.auth.signUp({email:e,password:p,options:{emailRedirectTo:BASE,data:{full_name:n,role_type:$('#rt').value,indigene_of:ind,indigene_doc_path:path}}});
$('#rb').disabled=false;
if(error)return msg('rm',error.message,1);
if(data.user&&data.user.identities&&data.user.identities.length===0)return msg('rm','This email is already registered. Try logging in.',1);
msg('rm','Almost done. Check your email to verify your address. After that, an administrator will approve your account.')}
async function forgot(){const e=$('#fe').value.trim();if(!e)return;const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:BASE});msg('fm',error?error.message:'If that email is registered, a time-limited reset link has been sent.',!!error)}
async function newPw(){const p=$('#np').value;if(p.length<8)return msg('nm','Password must be at least 8 characters.',1);const {error}=await SB.auth.updateUser({password:p});msg('nm',error?error.message:'Password updated. You can now continue.',!!error);if(!error)setTimeout(()=>{location.hash='#home'},1200)}
async function saveProf(){const v=id=>$('#'+id).value.trim(),c=id=>$('#'+id).checked;
const ok=await run(SB.from('profiles').update({full_name:v('pn'),department:v('pd'),level:v('pl'),grad_year:v('py'),interests:v('pi'),career:v('pc'),bio:v('pb'),phone:v('pp'),show_details:c('ps'),share_email:c('pe'),share_phone:c('ph'),email_notifications:c('pm')}).eq('id',S.sess.user.id));
if(ok){await loadProf();nav();msg('pmsg','Profile saved.')}}
function flt(){const t=($('#sq')||{value:''}).value.toLowerCase(),d=($('#sf')||{value:''}).value;
const r=S.rows.filter(x=>(!d||x.department===d)&&(!t||[x.full_name,x.department,x.interests,x.career].join(' ').toLowerCase().includes(t)));
$('#list').innerHTML=r.map(x=>`<div class="card"><div class="av">${ini(x.full_name)}</div><b>${esc(x.full_name)}</b><div class="mu">${esc(x.department||'')} ${x.role_type=='alumni'?(x.grad_year?'· Class of '+esc(x.grad_year):''):(x.level?'· '+esc(x.level)+' Level':'')}</div>${x.interests?`<span class="tag">${esc(x.interests)}</span>`:''}${x.career?`<div class="mu">${esc(x.career)}</div>`:''}${x.email?`<div class="mu">${esc(x.email)}</div>`:''}${x.phone?`<div class="mu">${esc(x.phone)}</div>`:''}</div>`).join('')||'<p class="mu">No matches.</p>'}
async function people(kind,title){if(!approved())return gate(title);S.rows=await q(SB.from('directory').select('*').eq('role_type',kind))||[];
window.after=flt;const ds=[...new Set(S.rows.map(x=>x.department).filter(Boolean))];
return `<h1>${title}</h1><div class="row"><input id="sq" placeholder="Search name, interest or career" oninput="flt()"><select id="sf" onchange="flt()"><option value="">All departments</option>${ds.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div><div id="list" class="grid"></div>`}
const V={
home:async()=>`<div class="hero"><h1>Connecting the BIDA community at IBBUL</h1><p>A home for BIDA students, alumni, university staff and the NABS IBBUL Chapter to meet, share and grow together.</p>${S.sess?'':'<a class="btn w" href="#register">Join now</a> <a class="btn o" style="color:#fff;border-color:#fff" href="#login">Log in</a>'}</div>
<h2>Explore</h2><div class="grid">${[['executives','NABS Executives','Meet the current team'],['staff','Staff','Mentors and lecturers'],['alumni','Alumni','Find graduates by year and field'],['students','Students','Connect with peers'],['announcements','Announcements','News and events']].map(x=>`<a class="card" style="text-decoration:none;color:inherit" href="#${x[0]}"><b>${x[1]}</b><div class="mu">${x[2]}</div></a>`).join('')}</div>`,
executives:async()=>{const t=await q(SB.from('exec_teams').select('*').order('is_current',{ascending:false}).order('created_at',{ascending:false}))||[],m=await q(SB.from('exec_members').select('*').order('sort'))||[];

staff:async()=>{const s=await q(SB.from('staff').select('*').order('name'))||[];return `<h1>Staff</h1><div class="grid">${s.map(x=>`<div class="card">${av(x.name.replace(/^(Dr|Prof|Mrs|Mr)\.? /,''),x.photo_url)}<b>${esc(x.name)}</b><div class="mu">${esc(x.title||'')}</div>${x.department?`<span class="tag">${esc(x.department)}</span>`:''}${x.contact?`<div class="mu">${esc(x.contact)}</div>`:''}</div>`).join('')||'<p class="mu">No staff added yet.</p>'}</div>`},

login:async()=>`<div class="form"><h1>Log in</h1><label>Email</label><input id="e" type="email" autocomplete="email">${pw('p','Password')}<button class="btn" onclick="login(false)">Log in</button> <a href="#forgot">Forgot password?</a><div id="lm" hidden></div></div>`,

<button class="btn" onclick="saveProf()">Save profile</button><div id="pmsg" hidden></div></div>`},

const mem=await q(SB.from('profiles').select('*').order('created_at',{ascending:false}))||[],teams=await q(SB.from('exec_teams').select('*').order('created_at',{ascending:false}))||[],ex=await q(SB.from('exec_members').select('*').order('sort'))||[],st=await q(SB.from('staff').select('*').order('name'))||[],nw=await q(SB.from('announcements').select('*').order('created_at',{ascending:false}))||[];

<div class="row"><input id="ts" placeholder="New session e.g. 2026/2027"><button class="btn s" style="flex:0" onclick="addTeam()">Create team</button></div>

<div class="row"><input id="sn" placeholder="Name"><input id="stt" placeholder="Title"><input id="sd" placeholder="Department"><input id="spf" type="file" accept="image/jpeg,image/pny').select('*').eq('role_type',kind))||[];
