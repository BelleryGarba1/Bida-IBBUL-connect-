<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<title>BIDA IBBUL CONNECT</title>
<style>
:root{--bg:#f4f7f5;--sf:#fff;--tx:#10231a;--mu:#60726a;--pr:#0b7a4b;--pr2:#e6f5ed;--pr3:#14b87a;--bd:#e1e9e4;--ac:#e0a526;--dg:#c62f26;--sh:0 1px 2px rgba(16,35,26,.05),0 8px 24px rgba(16,35,26,.06);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0b120e;--sf:#141e18;--tx:#e9f1ec;--mu:#9aada3;--pr:#3fd093;--pr2:#14291f;--pr3:#1fa86f;--bd:#233229;--ac:#f0bc4a;--dg:#f2918b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--pr)}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:1040px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--tx);text-decoration:none;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pr),var(--pr3));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px rgba(11,122,75,.35)}
main{max-width:1040px;margin:auto;padding:18px 16px 40px;min-height:62vh;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.7rem;line-height:1.2;margin:.3em 0 .4em;letter-spacing:-.02em}h2{font-size:1.15rem;margin:1.6em 0 .7em;letter-spacing:-.01em}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:34px 22px;color:#fff;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle at 10% 100%,rgba(224,165,38,.35),transparent 40%),linear-gradient(135deg,#0b7a4b,#06452a)}
.hero h1{font-size:2rem;max-width:560px}.hero p{max-width:540px;opacity:.92;margin:0 0 18px}
.pill{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-size:.78rem;font-weight:600}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--pr),var(--pr3));color:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(11,122,75,.28);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.o{background:transparent;color:var(--pr);border:1px solid var(--pr);box-shadow:none}.btn.w{background:#fff;color:#06452a;box-shadow:none}.btn.g{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}.btn.d{background:var(--dg);box-shadow:none}.btn.s{padding:7px 12px;font-size:.84rem;border-radius:10px;margin:2px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
a.card{text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}a.card:hover{transform:translateY(-3px);border-color:var(--pr3)}
.ico{width:46px;height:46px;border-radius:14px;background:var(--pr2);display:grid;place-items:center;font-size:1.4rem;margin-bottom:10px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--pr3));color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px;object-fit:cover}
.mu{color:var(--mu);font-size:.88rem}.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:99px;padding:3px 10px;font-size:.76rem;font-weight:600;margin:2px 4px 2px 0}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.steps .card b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pr);color:#fff;margin-right:8px;font-size:.85rem}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;margin:5px 0 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr3);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr3) 22%,transparent)}
label{font-size:.86rem;font-weight:600}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chk{display:flex;align-items:center;gap:8px;font-weight:400}.chk input{width:auto;margin:0}
.form{max-width:460px;margin:8px auto}.form.card{padding:22px}
.note{background:var(--pr2);border-radius:12px;padding:11px 13px;font-size:.88rem;margin:10px 0}
.msg{padding:11px 13px;border-radius:12px;background:var(--pr2);margin:12px 0}.err{background:#fde7e5;color:#8c1d18}
.admin{border-top:4px solid var(--ac)}
footer{text-align:center;padding:26px 16px 34px;color:var(--mu);font-size:.85rem}footer a{color:var(--mu);margin:0 8px;text-decoration:none}footer a:hover{color:var(--pr)}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--bd),var(--pr2),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.burger{border:1px solid var(--bd);background:var(--sf);color:var(--tx);width:42px;height:42px;border-radius:12px;font-size:1.3rem;cursor:pointer}
.drawer{position:fixed;inset:0;z-index:30}.drawer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(86vw,320px);background:var(--sf);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;box-shadow:-10px 0 30px rgba(0,0,0,.2);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.panel a{padding:12px 14px;border-radius:12px;color:var(--tx);text-decoration:none;font-weight:500}.panel a:hover{background:var(--pr2)}.panel a.on{background:var(--pr);color:#fff}
.panel .hi{padding:6px 14px 12px;color:var(--mu);font-weight:600}
.lg{height:34px;width:auto;max-width:64px;border-radius:8px;object-fit:contain;background:#fff;padding:2px}
.lgs{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:14px}.lgs .lg{height:64px;max-width:110px;padding:4px;box-shadow:var(--sh)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:16px}
.stat{text-align:center}.stat b{display:block;font-size:1.8rem;letter-spacing:-.02em;color:var(--pr)}
#flogos{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.credit{margin:4px 0;line-height:1.5}.credit b{color:var(--tx);letter-spacing:.01em}
</style></head><body>
<script>
function showErr(m){var a=document.getElementById('app');a.innerHTML='<div class="card"><b>Something went wrong.</b><p class="mu">'+String(m||'Unknown error').replace(/</g,'&lt;')+'</p><p class="mu">Try refreshing the page.</p></div>'}
window.addEventListener('error',function(e){showErr(e.message)});
window.addEventListener('unhandledrejection',function(e){showErr(e.reason&&e.reason.message?e.reason.message:e.reason)});
setTimeout(function(){var a=document.getElementById('app');if(a&&a.querySelector('.skel'))a.innerHTML=window.__main?'<div class="card"><b>Still loading…</b><p class="mu">Check your internet connection and refresh the page.</p></div>':'<div class="card"><b>The app file did not load.</b><p class="mu">Make sure app.js is uploaded in the same folder as index.html in your GitHub repo, then reload.</p></div>'},7000);
</script>
<header><div class="bar"><a class="logo" href="#home" id="brand"><span class="mark">B</span><span>BIDA IBBUL CONNECT</span></a><button class="burger" aria-label="Menu" onclick="toggleMenu()">&#9776;</button></div></header>
<div id="drawer" class="drawer" hidden><div class="scrim" onclick="toggleMenu()"></div><nav id="nav" class="panel"></nav></div>
<main id="app"><div class="skel" style="width:60%"></div></main>
<footer><div id="flogos"></div><p class="credit">Powered by <b>NABS IBBUL 2025/2026 EXECOS</b></p><p class="credit">Developed by <b>MUHAMMAD-BELLO NASIR GARBA (BELLERY GARBA)</b></p><p>© BIDA IBBUL CONNECT · v6</p></footer>
<script src="app.js?v=5"></script>
</body></html>
